name: Create Release and Update Repository

# Push a tag such as v0.1.0 to build and publish the plugin.
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Download Dalamud
        run: |
          Invoke-WebRequest -Uri https://goatcorp.github.io/dalamud-distrib/stg/latest.zip -OutFile dalamud.zip
          Expand-Archive -Force dalamud.zip "$env:AppData\XIVLauncher\addon\Hooks\dev"

      - name: Set release version
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}".TrimStart('v')
          if ($version -notmatch '^\d+\.\d+\.\d+(\.\d+)?$') {
            throw "Tag must use semantic version format vMAJOR.MINOR.PATCH, optionally with a fourth component."
          }
          "PLUGIN_VERSION=$version" >> $env:GITHUB_ENV

      - name: Restore
        run: dotnet restore AutoMeld.csproj

      - name: Build
        run: dotnet build AutoMeld.csproj -c Release --no-restore -p:Version=$env:PLUGIN_VERSION

      - name: Stage packaged plugin
        shell: pwsh
        run: |
          $zip = Get-ChildItem -Recurse -Filter latest.zip -Path bin | Select-Object -First 1
          if (-not $zip) { throw 'latest.zip was not produced by DalamudPackager.' }
          Copy-Item $zip.FullName -Destination latest.zip -Force

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: latest.zip
          draft: false
          prerelease: false

      - name: Update repo.json
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}".TrimStart('v')
          $link = "https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/latest.zip"
          $repo = Get-Content repo.json -Raw | ConvertFrom-Json
          $entry = $repo[0]
          $entry.AssemblyVersion = $version
          $entry.DownloadLinkInstall = $link
          $entry.DownloadLinkUpdate = $link
          $repo | ConvertTo-Json -Depth 10 -AsArray | Set-Content repo.json -Encoding UTF8

      - name: Commit updated repo.json
        uses: EndBug/add-and-commit@v9
        with:
          add: repo.json
          message: "Update repo.json for ${{ github.ref_name }}"
          default_author: github_actions
